name: Cloudflare Production Smoke Check

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live site and market data
        run: |
          root_code=$(curl -L -sS -o /tmp/root.html -w "%{http_code}" --max-time 20 "https://lager-iphone.samerabouamra.workers.dev/" || true)
          compare_code=$(curl -L -sS -o /tmp/compare.json -w "%{http_code}" --max-time 30 "https://lager-iphone.samerabouamra.workers.dev/api/market/compare?model=iPhone%2014&storage=128" || true)
          tradera_status=$(jq -r '.sources[]? | select(.source=="Tradera") | .status' /tmp/compare.json 2>/dev/null | head -1 || true)
          echo "root_http=$root_code compare_http=$compare_code tradera_status=$tradera_status"
          test "$root_code" = "200"
          test "$compare_code" = "200"
          test "$tradera_status" = "ok"
