name: Tradera Accurate Pricing Test

on:
  push:
    branches:
      - fix/tradera-accurate-pricing

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Tradera pricing filter
        run: |
          node --input-type=module - <<'NODE'
          import { fetchTraderaMarket } from "./lib/tradera-market.js";
          const r = await fetchTraderaMarket("iPhone 14 Pro Max", 128, { pages: 8 });
          console.log(JSON.stringify({
            count: r.listings.length,
            typical_price: r.typical_price,
            min_price: r.min_price,
            max_price: r.max_price,
            excluded_auctions: r.excluded_auctions,
            excluded_problem_listings: r.excluded_problem_listings,
            excluded_outliers: r.excluded_outliers,
            listings: r.listings.slice(0, 10)
          }, null, 2));
          if (!r.listings.length) process.exit(1);
          if (r.listings.some(x => x.price_type === "auction")) process.exit(2);
          if (r.excluded_auctions < 1) process.exit(3);
          NODE
      - name: Build OpenNext worker
        run: pnpm exec opennextjs-cloudflare build
      - name: Verify worker artifact
        run: test -f .open-next/worker.js
