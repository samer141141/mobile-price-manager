name: Cloudflare Server Validation

on:
  push:
    branches:
      - debug/cloudflare-server-validate

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build
        env:
          TRADERA_APP_ID: test-app-id
          TRADERA_APP_KEY: test-app-key
        run: pnpm run build
      - name: Deploy temporary worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADERA_APP_ID: test-app-id
          TRADERA_APP_KEY: test-app-key
        run: npx wrangler deploy --name lager-iphone-stage-debug
      - name: Delete temporary worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 delete --name lager-iphone-stage-debug --force || true
