name: Market Candidate Test

on:
  push:
    branches:
      - fix/market-without-secrets

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify Tradera public market parser
        run: |
          node --input-type=module -e 'import("./lib/tradera-market.js").then(async m => { const r = await m.fetchTraderaMarket("iPhone 14",128,{pages:4}); console.log("tradera_count="+r.listings.length); if (!r.listings.length) process.exit(1); console.log(r.listings.slice(0,3)); })'
      - name: Build OpenNext worker
        run: pnpm exec opennextjs-cloudflare build
      - name: Verify worker artifact
        run: test -f .open-next/worker.js
