name: Operations Suite Validation

on:
  push:
    branches:
      - feature/operations-command-center

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build OpenNext worker
        run: pnpm exec opennextjs-cloudflare build
      - name: Verify worker artifact
        run: test -f .open-next/worker.js
