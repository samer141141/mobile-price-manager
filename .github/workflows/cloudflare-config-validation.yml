name: Cloudflare Config Validation

on:
  push:
    branches:
      - fix/cloudflare-config-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build exactly like Cloudflare
        env:
          TRADERA_APP_ID: candidate-test-id
          TRADERA_APP_KEY: candidate-test-key
        run: pnpm run build
      - name: Dry-run deploy exactly like Cloudflare
        env:
          TRADERA_APP_ID: candidate-test-id
          TRADERA_APP_KEY: candidate-test-key
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run
