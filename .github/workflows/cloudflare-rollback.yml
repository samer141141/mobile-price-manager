name: Cloudflare Emergency Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore known working Worker version
        run: npx --yes wrangler@4.125.0 versions deploy 56f20d84-81eb-4261-a2d7-45063c69bc4d@100% -y --name lager-iphone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live site
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/site.html -w "%{http_code}" --max-time 20 "https://lager-iphone.samerabouamra.workers.dev/" || true)
            echo "HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && [ -s /tmp/site.html ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
