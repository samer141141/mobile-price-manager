name: Cloudflare Emergency Rollback

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore last known working Worker version
        run: npx --yes wrangler@4.37.1 versions deploy 56f20d84-81eb-4261-a2d7-45063c69bc4d@100% -y --name lager-iphone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
